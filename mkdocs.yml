site_name: SOI-Vorbereitungskurs
site_description: Vorbereitung auf Vorrunde und Erste Runde der Schweizer Informatik-Olympiade
site_url: https://masta-nksa.github.io/soi-kurs/
repo_url: https://github.com/masta-nksa/soi-kurs
theme:
  name: material
  language: de
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy
    - toc.follow
  palette:
    - scheme: default
      primary: teal
      toggle:
        icon: material/weather-night
        name: Dunkles Design
    - scheme: slate
      primary: teal
      toggle:
        icon: material/weather-sunny
        name: Helles Design

# Oeffnet alle Links auf fremde Seiten in einem neuen Tab.
hooks:
  - hooks/externe_links.py

markdown_extensions:
  - admonition
  - attr_list
  - tables
  - footnotes
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
  - toc:
      permalink: true

nav:
  - Start: index.md
  - Lernpfad: lernpfad.md
  - M0 Werkzeugkasten: m00-werkzeugkasten/index.md
  - M1 Problemanalyse:
      - Lernbaustein: m01-problemanalyse/index.md
      - Uebungen: m01-problemanalyse/uebungen.md
  - M2 Vollstaendige Suche:
      - Lernbaustein: m02-vollstaendige-suche/index.md
      - Uebungen: m02-vollstaendige-suche/uebungen.md
  - M3 Laufzeitdenken:
      - Lernbaustein: m03-laufzeitdenken/index.md
      - Uebungen: m03-laufzeitdenken/uebungen.md
  # Weitere Module werden hier ergaenzt, sobald sie gebaut sind.
  # loesung.md steht bewusst NICHT in der Navigation - der Weg dorthin fuehrt
  # nur ueber den Link am Ende der Uebungsseite.
  # Das Verzeichnis lp/ bleibt bewusst ausserhalb der Navigation.
