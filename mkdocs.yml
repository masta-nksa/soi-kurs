site_name: SOI-Vorbereitungskurs
site_description: Vorbereitung auf Vorrunde und Erste Runde der Schweizer Informatik-Olympiade
site_url: https://masta-nksa.github.io/soi-kurs/
repo_url: https://github.com/masta-nksa/soi-kurs
theme:
  name: material
  language: de
  features:
    - navigation.sections
    # Der Modultitel selbst verlinkt auf den Lernbaustein.
    - navigation.indexes
    - navigation.top
    # Blaettern am Seitenende: der rote Faden auch in der Bedienung.
    - navigation.footer
    - navigation.tracking
    - content.code.copy
    - toc.follow
    - search.suggest
    - search.highlight
  palette:
    - scheme: default
      primary: teal
      toggle:
        icon: material/weather-night
        name: Dunkles Design
    - scheme: slate
      primary: teal
      toggle:
        icon: material/weather-sunny
        name: Helles Design

# Oeffnet alle Links auf fremde Seiten in einem neuen Tab.
hooks:
  - hooks/externe_links.py

markdown_extensions:
  - admonition
  - attr_list
  # md_in_html wird fuer die Karten auf der Startseite gebraucht.
  - md_in_html
  - tables
  - footnotes
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
  - toc:
      permalink: true

nav:
  - Start: index.md
  - Lernpfad: lernpfad.md
  - Konzepte von A bis Z: konzepte.md
  - M0 Werkzeugkasten: m00-werkzeugkasten/index.md
  - M1 Problemanalyse und Modellierung:
      - m01-problemanalyse/index.md
      - Übungen zu M1: m01-problemanalyse/uebungen.md
  - M2 Vollständige Suche:
      - m02-vollstaendige-suche/index.md
      - Übungen zu M2: m02-vollstaendige-suche/uebungen.md
  - M3 Laufzeitdenken:
      - m03-laufzeitdenken/index.md
      - Übungen zu M3: m03-laufzeitdenken/uebungen.md
  - M4 Felder und lineare Techniken:
      - m04-lineare-techniken/index.md
      - Übungen zu M4: m04-lineare-techniken/uebungen.md
  - M5 Sortieren und Suchen:
      - m05-sortieren-und-suchen/index.md
      - Übungen zu M5: m05-sortieren-und-suchen/uebungen.md
  - Hintergrund:
      - Sortierverfahren: hintergrund/sortierverfahren.md
  # Weitere Module werden hier ergaenzt, sobald sie gebaut sind: M6
  # Zeichenketten und Gitter, M7 Konstruktive Verfahren, B1 und B2 fuer
  # Strang B.
  #
  # "Hintergrund" steht bewusst ausserhalb des Kursfadens: Seiten, die
  # erklaeren, wie ein Werkzeug innen funktioniert. Optional zu lesen.
  #
  # loesung.md steht bewusst NICHT in der Navigation - der Weg dorthin fuehrt
  # nur ueber den Link am Ende der Uebungsseite.
  # Das Verzeichnis lp/ bleibt bewusst ausserhalb der Navigation.
